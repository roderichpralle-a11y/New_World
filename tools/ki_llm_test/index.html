<!doctype html><html><body><script src="ki_llm.js"></script><script>
const cfg = { lib_urls: [location.origin + '/transformers.min.js'], models: { rat: ['tiny-llama'], siedler: ['tiny-smol'], rat_small: ['tiny-smol'] },
  dtypes: { webgpu_f16: ['fp32'], webgpu: ['fp32'], wasm: ['q4', 'fp32'] }, device: 'wasm', remote_host: location.origin + '/hf/', wasm_paths: location.origin + '/ort/' };
window.out = [];
KiLlm.init(JSON.stringify(cfg));
const ask = [{ role: 'system', content: 'Du bist ein Rat.' }, { role: 'user', content: 'Was tun?\n1) Essen\n2) Holz\nAntworte nur mit der Nummer.' }];
const iv = setInterval(() => {
  const p = JSON.parse(KiLlm.poll());
  window.out.push(...p.results);
  window.st = p.status;
  if (p.status.state === 'bereit' && !window.sent) {
    window.sent = true;
    KiLlm.submit(JSON.stringify({ id: 1, model: 'rat', mode: 'choose', messages: ask, n: 2 }));
    KiLlm.submit(JSON.stringify({ id: 2, model: 'siedler', mode: 'generate', messages: ask, max_new_tokens: 6, temperature: 0.5 }));
  }
}, 100);
</script></body></html>
